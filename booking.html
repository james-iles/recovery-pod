<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book a Session | Recovery Pod Bristol</title>
    <meta
      name="description"
      content="Book your sauna and cold plunge contrast therapy session at Recovery Pod Bristol."
    />
    <meta name="author" content="Recovery Pod" />
    <meta name="theme-color" content="#66B9A3" />

    <link rel="canonical" href="https://recoverypodbristol.com/booking" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://recoverypodbristol.com/booking" />
    <meta property="og:title" content="Book a Session | Recovery Pod Bristol" />
    <meta
      property="og:description"
      content="Book your contrast therapy session at Recovery Pod Bristol."
    />
    <meta
      property="og:image"
      content="https://recoverypodbristol.com/assets/images/og-image.jpg"
    />
    <meta property="og:locale" content="en_GB" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="/" class="logo">Recovery Pod</a>
        <nav class="nav" aria-label="Main navigation">
          <ul class="nav__list">
            <li><a href="/about" class="nav__link">About</a></li>
            <li>
              <a href="/booking" class="nav__link nav__link--active">Book</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="hero hero--compact">
        <div class="container">
          <div class="hero__content hero__content--centered">
            <span class="hero__tagline">Book Now</span>
            <h1 class="hero__title">Reserve Your <span>Session</span></h1>
            <p class="hero__text">
              Choose a time that works for you. Sessions include full access to
              our Swedish sauna and cold plunge facilities.
            </p>
          </div>
        </div>
      </section>

      <section class="section section--booking">
        <div class="booking-embed">
          <iframe
            src="https://app.acuityscheduling.com/schedule.php?owner=38359809&ref=embedded_csp"
            title="Schedule Appointment"
            width="100%"
            height="800"
            frameborder="0"
            allow="payment"
          ></iframe>
          <script
            src="https://embed.acuityscheduling.com/js/embed.js"
            type="text/javascript"
          ></script>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container footer__inner">
        <a href="/" class="logo footer__logo">Recovery Pod</a>
        <div class="footer__social">
          <a
            href="https://www.instagram.com/therecoverypodcontrasttherapy"
            class="footer__social-link"
            aria-label="Follow us on Instagram"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>
        </div>
        <p class="footer__text">
          &copy; 2025 Recovery Pod. All rights reserved.
        </p>
        <p class="footer__text">
          Calmly crafted by
          <a href="https://jamesiles.uk" target="_blank">James</a>
        </p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
